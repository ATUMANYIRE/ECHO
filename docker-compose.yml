services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: echo-backend
    restart: unless-stopped
    ports:
      - "8005:8000"
    environment:
      - ENVIRONMENT=production
      - DEBUG=false
      - PORT=8000
      - HOST=0.0.0.0
      - CORS_ORIGINS=["http://localhost:3005","http://127.0.0.1:3005"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: echo-frontend
    restart: unless-stopped
    ports:
      - "3005:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost:8005
    depends_on:
      backend:
        condition: service_healthy
